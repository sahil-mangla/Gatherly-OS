name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Automated Test Suite
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci-test.db
      PBKDF2_ITERATIONS: "1000"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff radon bandit pip-audit

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check backend scripts api
          ruff format --check backend

      - name: Cyclomatic Complexity Gate (max 9)
        run: |
          ruff check --select C901 --config 'lint.mccabe.max-complexity=9' backend scripts api
          radon cc -s -n B backend scripts api
          python scripts/check_complexity.py --max 9

      - name: JavaScript Lint & Complexity Gate (max 9)
        run: |
          npm run lint:js

      - name: Static Security Scan (bandit)
        run: |
          bandit -r backend -ll

      - name: Dependency Vulnerability Audit (pip-audit, advisory)
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt

      - name: Python Tests with Line + Branch Coverage Gate (>= 95%)
        run: |
          python -m pytest backend/tests --cov=backend/app --cov-branch --cov-report=term-missing --cov-fail-under=95

      - name: JavaScript Tests with Coverage Gate and No-Skip Check
        shell: bash
        run: |
          # jsdom/axe come from `npm install`; a silent skip of the DOM tests would hide regressions.
          node --test --experimental-test-coverage \
            --test-coverage-include='frontend/src/**' \
            --test-coverage-lines=90 --test-coverage-branches=80 --test-coverage-functions=85 \
            --test-reporter=tap frontend/tests/*.test.js | tee node-test.log
          grep -qE '^# skipped 0$' node-test.log

      - name: Enforce Max 200 Lines of Code Rule
        run: |
          python scripts/check_line_limits.py

      - name: Run Asynchronous Load Test & SLA Gate (Sub-150ms p95 & 0% Errors)
        run: |
          python scripts/load_test.py --asgi --requests 200 --concurrency 30 --max-p95 150

      - name: Run Playwright End-to-End Suite
        run: |
          npx -y playwright install --with-deps chromium
          npm run test:e2e


  container-build:
    name: Production Container Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gatherly:latest
