name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest ruff python-dotenv google-genai httpx sqlalchemy pyjwt psycopg2-binary opentelemetry-api opentelemetry-sdk

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run Automated Test Suite (Pytest + Node Test + E2E Contracts)
        run: |
          npm test

      - name: Enforce Max 200 Lines of Code Rule
        run: |
          python scripts/check_line_limits.py

      - name: Run Asynchronous Load Test & SLA Gate (Sub-150ms p95 & 0% Errors)
        run: |
          python scripts/load_test.py --requests 200 --concurrency 30 --max-p95 150

      - name: Run Playwright End-to-End Suite
        run: |
          npx -y playwright install --with-deps chromium
          npm run test:e2e


  container-build:
    name: Production Container Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gatherly:latest
