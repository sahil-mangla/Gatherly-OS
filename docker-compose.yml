# Requires POSTGRES_PASSWORD and JWT_SECRET (see .env.example); compose refuses to start without them.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gatherly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env}
      POSTGRES_DB: gatherly_enterprise
    # No host port is published: only the app container (same compose network) reaches the DB.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatherly -d gatherly_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5

  gatherly:
    build:
      context: .
      dockerfile: Dockerfile
    image: gatherly:latest
    container_name: gatherly-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      ENVIRONMENT: production
      DATABASE_URL: postgresql://gatherly:${POSTGRES_PASSWORD}@postgres:5432/gatherly_enterprise
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>= 32 random bytes) for production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      LOG_FORMAT: json
      OTEL_ENABLED: "true"
    # The image ships a stdlib-based HEALTHCHECK against /api/health.

volumes:
  pgdata:
    driver: local
