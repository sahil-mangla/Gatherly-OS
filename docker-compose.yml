version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gatherly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: gatherly_secret_password
      POSTGRES_DB: gatherly_enterprise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatherly -d gatherly_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5

  gatherly:
    build:
      context: .
      dockerfile: Dockerfile
    image: gatherly:latest
    container_name: gatherly-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://gatherly:gatherly_secret_password@postgres:5432/gatherly_enterprise
      - LOG_FORMAT=json
      - OTEL_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local

