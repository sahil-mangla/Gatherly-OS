services:
  - type: web
    name: gatherly-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: OTEL_ENABLED
        value: true
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gatherly-db
          property: connectionString

databases:
  - name: gatherly-db
    databaseName: gatherly
    user: gatherly_user
    plan: starter
    ipAllowList: [] # internal access only
